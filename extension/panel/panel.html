<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wingpen</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Wingpen</span>
      <span id="status" class="status status--unknown">
        <span class="status-dot"></span>
        <span class="status-label">…</span>
      </span>
    </div>
    <button id="openOptions" class="icon-button" type="button" title="Réglages">⚙</button>
  </header>

  <div id="connectionBanner" class="connection-banner" hidden>
    <span id="connectionBannerText"></span>
    <button id="connectWingpen" class="connection-banner-cta" type="button" hidden>Ouvrir /pair</button>
  </div>

  <section class="toolbar">
    <button id="mainAction" class="toolbar-button toolbar-button--primary" type="button">Résumer</button>
    <button id="activateSite" class="link-button" type="button" hidden>Activer Wingpen sur ce site</button>
    <select id="promptSelect" class="prompt-select">
      <option value="">Bibliothèque de prompts…</option>
    </select>
    <button id="savePrompt" class="icon-button" type="button" title="Enregistrer le texte saisi comme prompt">💾</button>
  </section>

  <main id="messages" class="messages" aria-live="polite"></main>

  <footer class="composer">
    <label class="composer-toggle" for="attachPage">
      <input type="checkbox" id="attachPage" disabled />
      Wingpen lit cette page
    </label>
    <textarea id="input" class="composer-input" placeholder="Écrivez à Wingpen…" rows="2"></textarea>
    <div class="composer-actions">
      <button id="eraseConversation" class="link-button link-button--danger" type="button">Effacer la conversation</button>
      <button id="cancel" class="composer-button composer-button--ghost" type="button" hidden>Annuler</button>
      <button id="send" class="composer-button" type="button">Envoyer</button>
    </div>
  </footer>

  <div id="buildInfo" class="build-info"></div>

  <script src="panel.js" type="module"></script>
</body>
</html>

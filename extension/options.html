<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Réglages — Wingpen</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 40px auto;
      color: #1f2430;
      font-size: 14px;
    }
    h1 { font-size: 18px; }
    p.help { color: #666; line-height: 1.5; }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 16px 0;
    }
    input[type="password"], input[type="text"] {
      font-family: inherit;
      font-size: 13.5px;
      padding: 8px;
      border: 1px solid #d8d8de;
      border-radius: 8px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      border: none;
      background: #3b5cf6;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #2d4be0; }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: #666;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #bbb;
    }
    .status--connected .status-dot { background: #2fb757; }
    .status--connecting .status-dot,
    .status--handshaking .status-dot { background: #e8a53c; }
    .status--disconnected .status-dot,
    .status--no-token .status-dot { background: #d5495a; }
  </style>
</head>
<body>
  <h1>Réglages Wingpen</h1>
  <p class="help">
    Collez le jeton de pairage affiché par le broker au premier démarrage
    (fichier <code>~/.local/share/wingpen/pairing.txt</code>). Le jeton n'est
    jamais écrit sur le disque par l'extension : il reste en mémoire vive et
    disparaît à la fermeture du navigateur.
  </p>

  <div class="field">
    <label for="token">Jeton de pairage</label>
    <input id="token" type="password" autocomplete="off" placeholder="…" />
  </div>

  <div class="actions">
    <button id="save" type="button">Enregistrer</button>
    <span id="status" class="status status--unknown">
      <span class="status-dot"></span>
      <span class="status-label">…</span>
    </span>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
